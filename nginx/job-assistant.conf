# ==============================================================================
# Nginx Configuration for Job Assistant Pro (Next.js 16)
# ==============================================================================
# 1. Copy this file:
#    sudo cp nginx/job-assistant.conf /etc/nginx/sites-available/job-assistant.conf
#
# 2. Update 'yourdomain.com' with your actual domain or VPS IP:
#    sudo nano /etc/nginx/sites-available/job-assistant.conf
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/job-assistant.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. (Optional) Issue free SSL certificate with Let's Encrypt / Certbot:
#    sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ==============================================================================

upstream job_assistant_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Cache static Next.js assets
    location /_next/static/ {
        proxy_pass http://job_assistant_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main reverse proxy
    location / {
        proxy_pass http://job_assistant_backend;
        proxy_http_version 1.1;

        # WebSocket & streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Generous timeouts for multi-source live job fetching (10 APIs)
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
